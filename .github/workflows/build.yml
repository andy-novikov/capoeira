name: Build songbook

on:
  push:
    branches: [master]
  workflow_dispatch:

# One release update at a time, so two quick pushes can't race on the tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write  # create the release and move its tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # build.sh gets pandoc and typst from the nixpkgs pinned in flake.lock.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build PDF and DOCX
        run: scripts/build.sh

      # A single release tagged "latest", updated in place, so the download
      # links never change:
      #   https://github.com/<owner>/<repo>/releases/download/latest/songs.pdf
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d)."
          git tag -f latest
          git push -f origin latest
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/* --clobber
            gh release edit latest --notes "$notes" --latest
          else
            gh release create latest dist/* --title "Songbook" --notes "$notes" --latest
          fi
